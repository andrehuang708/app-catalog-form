# Two separate containers, as designed for the air-gapped deployment:
#
#   app  — the built Vite bundle + Hono API server (Dockerfile in this repo)
#   db   — stock postgres:17-alpine with its data in a named volume
#
# The app only ever talks to `db:5432` over the compose network (plaintext
# inside the network, hence sslmode=disable) and never reaches the internet.
#
#   docker compose up -d
#
# Schema is created idempotently by the app on first query — no migration
# step. Optional demo data:  docker compose exec app bun scripts/seed.ts

services:
  app:
    build: .
    image: kube-onboarding-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}?sslmode=disable
      PORT: "8080"
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:8080/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
